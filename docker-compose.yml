services:
  app:
    build:
      context: .
      dockerfile: Hongdal/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "${HONGDAL_DB_CONNECTION_STRING:-server=mysql;port=3306;database=hongdal_dev;user=hongdal;password=YOUR_LOCAL_PASSWORD;}"
      Redis__ConnectionString: "${HONGDAL_REDIS_CONNECTION_STRING:-redis:6379}"
      MongoDb__ConnectionString: "${HONGDAL_MONGO_CONNECTION_STRING:-mongodb://hongdal:YOUR_LOCAL_PASSWORD@mongo:27017/?authSource=admin}"
      MongoDb__Database: hongdal_dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${HONGDAL_MYSQL_ROOT_PASSWORD:-YOUR_LOCAL_ROOT_PASSWORD}"
      MYSQL_DATABASE: hongdal_dev
      MYSQL_USER: hongdal
      MYSQL_PASSWORD: "${HONGDAL_MYSQL_PASSWORD:-YOUR_LOCAL_PASSWORD}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${HONGDAL_MYSQL_ROOT_PASSWORD:-YOUR_LOCAL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hongdal
      MONGO_INITDB_ROOT_PASSWORD: "${HONGDAL_MONGO_ROOT_PASSWORD:-YOUR_LOCAL_PASSWORD}"
      MONGO_INITDB_DATABASE: hongdal_dev
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  redis_data:
  mongo_data:
