services:
  app:
    build:
      context: .
      dockerfile: Ssalddel/Dockerfile
    restart: unless-stopped
    ports:
      - "${SSALDDEL_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${SSALDDEL_ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: http://+:8080
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ConnectionStrings__DefaultConnection: "${SSALDDEL_DB_CONNECTION_STRING:-server=mysql;port=3306;database=ssalddel_dev;user=ssalddel;password=YOUR_LOCAL_PASSWORD;}"
      TransientState__Provider: "${SSALDDEL_TRANSIENT_STATE_PROVIDER:-Memory}"
      Redis__ConnectionString: "${SSALDDEL_REDIS_CONNECTION_STRING:-redis:6379}"
      MongoDb__ConnectionString: "${SSALDDEL_MONGO_CONNECTION_STRING:-mongodb://ssalddel:YOUR_LOCAL_PASSWORD@mongo:27017/?authSource=admin}"
      MongoDb__Database: ssalddel_dev
      DatabaseInitialization__RunAtStartup: "${SSALDDEL_DATABASE_INITIALIZATION_AT_STARTUP:-false}"
      DatabaseInitialization__FailOnError: "true"
      Jwt__Issuer: Ssalddel.Dev
      Jwt__Audience: Ssalddel.Client.Dev
      Jwt__SecretKey: "${SSALDDEL_JWT_SECRET_KEY:-development-only-jwt-secret-key-change-me-32bytes}"
      IsmsPProtectedData__Aes256GcmKeyBase64: "${SSALDDEL_ISMSP_AES256_GCM_KEY_BASE64:-}"
      IsmsPProtectedData__HashSalt: "${SSALDDEL_ISMSP_HASH_SALT:-}"
      IsmsPProtectedData__TransportKeyId: "${SSALDDEL_ISMSP_TRANSPORT_KEY_ID:-ssalddel-local-transport-v1}"
      IsmsPProtectedData__TransportPublicKeyPem: "${SSALDDEL_ISMSP_TRANSPORT_PUBLIC_KEY_PEM:-}"
      IsmsPProtectedData__TransportPrivateKeyPem: "${SSALDDEL_ISMSP_TRANSPORT_PRIVATE_KEY_PEM:-}"
      IsmsPProtectedData__FailWhenKeyMissing: "${SSALDDEL_ISMSP_FAIL_WHEN_KEY_MISSING:-false}"
      AgriculturalFisheriesBatch__Enabled: "${SSALDDEL_AGRICULTURAL_FISHERIES_BATCH_ENABLED:-false}"
      AgriculturalFisheriesBatch__KamisDailyEnabled: "${SSALDDEL_KAMIS_DAILY_BATCH_ENABLED:-true}"
      AgriculturalFisheriesBatch__KamisDailyCronExpression: "${SSALDDEL_KAMIS_DAILY_CRON_EXPRESSION:-0 30 6 * * ?}"
      AgriculturalFisheriesBatch__KamisMonthlyEnabled: "${SSALDDEL_KAMIS_MONTHLY_BATCH_ENABLED:-true}"
      AgriculturalFisheriesBatch__KamisMonthlyCronExpression: "${SSALDDEL_KAMIS_MONTHLY_CRON_EXPRESSION:-0 0 7 2 * ?}"
      AgriculturalFisheriesBatch__UsdaMonthlyEnabled: "${SSALDDEL_USDA_MONTHLY_BATCH_ENABLED:-true}"
      AgriculturalFisheriesBatch__UsdaMonthlyCronExpression: "${SSALDDEL_USDA_MONTHLY_CRON_EXPRESSION:-0 30 7 10 * ?}"
      PublicData__Kamis__CertificationKey: "${SSALDDEL_KAMIS_CERTIFICATION_KEY:-}"
      PublicData__Kamis__RequesterId: "${SSALDDEL_KAMIS_REQUESTER_ID:-}"
      PublicData__UsdaNassQuickStats__ApiKey: "${SSALDDEL_USDA_NASS_API_KEY:-}"
      TossPayments__ClientKey: "${SSALDDEL_TOSS_CLIENT_KEY:-development-only-client-key}"
      TossPayments__SecretKey: "${SSALDDEL_TOSS_SECRET_KEY:-development-only-secret-key}"
      GoogleGeocodingApiKey: "${SSALDDEL_GOOGLE_GEOCODING_API_KEY:-development-only-google-geocoding-key}"
      NaverCloudDirections__ApiKeyId: "${SSALDDEL_NAVER_CLOUD_DIRECTIONS_API_KEY_ID:-development-only-naver-key-id}"
      NaverCloudDirections__ApiKey: "${SSALDDEL_NAVER_CLOUD_DIRECTIONS_API_KEY:-development-only-naver-key}"
      CommunityPostTranslation__Enabled: "${SSALDDEL_COMMUNITY_TRANSLATION_ENABLED:-false}"
      CommunityPostTranslation__ApiKey: "${SSALDDEL_AZURE_TRANSLATOR_KEY:-}"
      CommunityPostTranslation__Region: "${SSALDDEL_AZURE_TRANSLATOR_REGION:-koreacentral}"
      SsalddelLogging__FilePath: "logs/ssalddel-.log"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - app_data:/app/App_Data
      - app_uploads:/app/uploads
      - app_community:/app/community
      - app_logs:/app/logs

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${SSALDDEL_MYSQL_ROOT_PASSWORD:-YOUR_LOCAL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ssalddel_dev
      MYSQL_USER: ssalddel
      MYSQL_PASSWORD: "${SSALDDEL_MYSQL_PASSWORD:-YOUR_LOCAL_PASSWORD}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${SSALDDEL_MYSQL_ROOT_PASSWORD:-YOUR_LOCAL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ssalddel
      MONGO_INITDB_ROOT_PASSWORD: "${SSALDDEL_MONGO_ROOT_PASSWORD:-YOUR_LOCAL_PASSWORD}"
      MONGO_INITDB_DATABASE: ssalddel_dev
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db

volumes:
  app_data:
  app_uploads:
  app_community:
  app_logs:
  mysql_data:
  redis_data:
  mongo_data:
