  <text x="42" y="68" class="sub">한 주문의 상태 변경 뒤 주문자·음식점·기사·원장이 같은 주문번호를 다시 조회했을 때의 화면 변화를 봅니다.</text>
  <rect x="1050" y="22" width="348" height="48" rx="14" fill="#282532"/>
