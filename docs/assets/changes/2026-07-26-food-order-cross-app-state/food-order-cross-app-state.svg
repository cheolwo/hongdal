<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180">
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", "Segoe UI", Arial, sans-serif; fill: #282532; }
      .title { font-size: 28px; font-weight: 800; }
      .sub { font-size: 13px; fill: #716d7b; }
      .h2 { font-size: 18px; font-weight: 800; }
      .h3 { font-size: 15px; font-weight: 800; }
      .body { font-size: 13px; font-weight: 600; }
      .small { font-size: 11px; fill: #716d7b; }
      .tiny { font-size: 9.5px; fill: #827d8b; }
      .chip { font-size: 10px; font-weight: 800; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .white { fill: #ffffff; }
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#3b3550" flood-opacity="0.11"/>
