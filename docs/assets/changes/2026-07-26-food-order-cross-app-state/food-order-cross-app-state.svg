  <text x="1070" y="61" font-size="15" font-weight="800" class="mono white">FO-20260726-0184</text>
  <circle cx="1372" cy="46" r="10" fill="#51b97b"/>
  <path d="M1367 46l4 4 7-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

