<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "Helvetica Neue", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #18302F; }
      .title { font-size: 25px; font-weight: 800; }
      .subtitle { font-size: 12px; fill: #64748B; }
      .screen-title { font-size: 22px; font-weight: 800; }
      .section { font-size: 14px; font-weight: 800; }
      .body { font-size: 12px; }
      .small { font-size: 10px; fill: #64748B; }
      .micro { font-size: 9px; fill: #64748B; }
      .value { font-size: 15px; font-weight: 800; }
      .button { font-size: 11px; font-weight: 800; }
      .api { font-family: Consolas, "Courier New", monospace; font-size: 10px; fill: #00796F; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#EEF1F5"/>
  <text x="54" y="46" class="title">04.19 · 일반 운송 기사 · 운행 예약 생성·상세·취소</text>
  <text x="54" y="71" class="subtitle">예약 목록에서 미래 일정을 추가하고, 같은 예약 ID의 상세를 다시 조회한 뒤 시작 전 예약만 명시적으로 취소합니다.</text>

  <g transform="translate(54 96)">
    <rect width="390" height="850" rx="18" fill="#F4FAF8" filter="url(#shadow)"/>
    <text x="0" y="-14" class="api">GET /api/v1/driver/reservations</text>
    <rect width="390" height="58" rx="18" fill="#FFFFFF"/><rect y="40" width="390" height="18" fill="#FFFFFF"/>
    <text x="18" y="36" font-size="22" font-weight="700" fill="#008F83">☰</text>
    <text x="51" y="35" font-size="17" font-weight="800">살뜰 기사</text>
    <text x="137" y="34" class="small">일반 운송</text>
    <text x="312" y="34" class="small">알림 3</text>
    <circle cx="362" cy="29" r="15" fill="#009688"/><text x="362" y="34" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">D</text>

    <text x="18" y="93" class="screen-title">운행 예약</text>
    <rect x="286" y="72" width="86" height="31" rx="15" fill="#009688"/>
    <text x="329" y="92" text-anchor="middle" class="button" fill="#FFFFFF">+ 새 예약</text>
    <text x="18" y="117" class="subtitle">서버에 저장된 내 예약을 시작시각 순서로 확인합니다.</text>

    <rect x="18" y="136" width="354" height="62" rx="11" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="160" class="small">이번 주</text>
    <text x="32" y="182" class="section">7월 27일 월요일 · 예정 2건</text>
    <rect x="277" y="151" width="79" height="31" rx="15" fill="#DDF5F1"/><text x="316" y="171" text-anchor="middle" class="button" fill="#00796F">새로고침</text>

    <rect x="18" y="212" width="354" height="168" rx="12" fill="#FFFFFF" stroke="#BFD8D4"/>
    <rect x="18" y="212" width="7" height="168" rx="3" fill="#009688"/>
    <text x="36" y="242" class="small">예약 #824 · 미래 예약</text>
    <text x="36" y="270" class="value">07월 27일 09:30</text>
    <rect x="277" y="229" width="79" height="25" rx="12" fill="#E7F7F3"/><text x="316" y="246" text-anchor="middle" class="button" fill="#00796F">예약</text>
    <text x="36" y="301" class="small">시작 위치</text><text x="36" y="322" class="body" font-weight="700">성남시 분당구 정자동</text>
    <text x="36" y="347" class="small">복귀지</text><text x="36" y="367" class="body">서울시 송파구 문정동</text>
    <rect x="258" y="334" width="98" height="33" rx="8" fill="#FFFFFF" stroke="#BFD5D2"/><text x="307" y="355" text-anchor="middle" class="button">상세 보기</text>

    <rect x="18" y="394" width="354" height="132" rx="12" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="423" class="small">예약 #819 · 지난 예약</text>
    <text x="32" y="450" class="value">07월 26일 08:00</text>
    <rect x="277" y="409" width="79" height="25" rx="12" fill="#F1F5F9"/><text x="316" y="426" text-anchor="middle" class="button">지난 예약</text>
    <text x="32" y="480" class="small">시작 위치</text><text x="32" y="501" class="body">서울시 강동구 천호동 · 복귀지 미설정</text>

    <rect x="18" y="544" width="354" height="126" rx="11" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="569" class="section">목록 상태</text>
    <rect x="32" y="584" width="92" height="61" rx="8" fill="#F8FAFC"/>
    <rect x="43" y="597" width="68" height="7" rx="3" fill="#D9E2E7"/><rect x="43" y="612" width="52" height="7" rx="3" fill="#E6ECEF"/>
    <text x="78" y="638" text-anchor="middle" class="micro">불러오는 중</text>
    <rect x="131" y="584" width="92" height="61" rx="8" fill="#F8FAFC"/><text x="177" y="610" text-anchor="middle" class="body">예약 없음</text><text x="177" y="632" text-anchor="middle" class="micro">새 예약 만들기</text>
    <rect x="230" y="584" width="110" height="61" rx="8" fill="#FFF4E8"/><text x="285" y="608" text-anchor="middle" class="body">조회 실패</text><text x="285" y="632" text-anchor="middle" class="button" fill="#B45309">다시 시도</text>

    <rect x="18" y="688" width="354" height="70" rx="10" fill="#E7F7F3"/>
    <text x="32" y="713" class="section" fill="#00796F">목록 응답 그대로 표시</text>
    <text x="32" y="735" class="small">StartTime · StartLocation · ReturnDestination · IsFuture</text>
    <text x="32" y="751" class="micro">없는 운임·차량 조건은 예약 카드에 임의로 추가하지 않습니다.</text>

    <line x1="0" y1="790" x2="390" y2="790" stroke="#D7E3E1"/>
    <text x="49" y="819" text-anchor="middle" class="micro">⌂</text><text x="49" y="836" text-anchor="middle" class="micro">홈</text>
    <text x="147" y="819" text-anchor="middle" class="micro">◇</text><text x="147" y="836" text-anchor="middle" class="micro">추천</text>
    <text x="245" y="819" text-anchor="middle" font-size="15" fill="#009688">▣</text><text x="245" y="836" text-anchor="middle" class="micro" fill="#009688">예약</text>
    <text x="342" y="819" text-anchor="middle" class="micro">₩</text><text x="342" y="836" text-anchor="middle" class="micro">정산</text>
  </g>

  <g transform="translate(525 96)">
    <rect width="390" height="850" rx="18" fill="#F4FAF8" filter="url(#shadow)"/>
    <text x="0" y="-14" class="api">POST /api/v1/driver/reservations</text>
    <rect width="390" height="58" rx="18" fill="#FFFFFF"/><rect y="40" width="390" height="18" fill="#FFFFFF"/>
    <text x="18" y="36" font-size="22" font-weight="700" fill="#008F83">‹</text><text x="52" y="35" font-size="17" font-weight="800">새 운행 예약</text>

    <text x="18" y="94" class="screen-title">언제, 어디서 시작할까요?</text>
    <text x="18" y="118" class="subtitle">미래 시각과 시작 위치를 확인한 뒤 직접 저장합니다.</text>

    <text x="18" y="156" class="section">시작시각 <tspan fill="#DC2626">*</tspan></text>
    <rect x="18" y="169" width="354" height="51" rx="9" fill="#FFFFFF" stroke="#91B8B3"/>
    <text x="34" y="200" class="body" font-weight="700">2026. 07. 27. 월 · 오전 09:30</text><text x="348" y="200" text-anchor="end" class="body" fill="#00796F">변경</text>
    <text x="18" y="239" class="small">현재보다 미래 시각만 예약할 수 있습니다.</text>

    <text x="18" y="279" class="section">시작 위치 <tspan fill="#DC2626">*</tspan></text>
    <rect x="18" y="292" width="354" height="51" rx="9" fill="#FFFFFF" stroke="#91B8B3"/>
    <text x="34" y="323" class="body">성남시 분당구 정자동</text>
    <rect x="272" y="301" width="84" height="33" rx="8" fill="#DDF5F1"/><text x="314" y="322" text-anchor="middle" class="button" fill="#00796F">현재 위치</text>
    <text x="18" y="362" class="small">필수 · 최대 200자 · 위치 권한 없이 직접 입력 가능</text>

    <text x="18" y="402" class="section">복귀지 <tspan class="small">선택</tspan></text>
    <rect x="18" y="415" width="354" height="51" rx="9" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="34" y="446" class="body">서울시 송파구 문정동</text><text x="348" y="446" text-anchor="end" class="small">지우기</text>
    <text x="18" y="485" class="small">미설정으로 저장할 수도 있습니다 · 최대 200자</text>

    <rect x="18" y="512" width="354" height="113" rx="11" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="539" class="section">저장할 예약</text>
    <text x="32" y="565" class="small">시작 모드</text><text x="128" y="565" class="body" font-weight="700">reserved</text>
    <text x="32" y="589" class="small">시작</text><text x="128" y="589" class="body">07월 27일 09:30 · 정자동</text>
    <text x="32" y="613" class="small">복귀</text><text x="128" y="613" class="body">문정동</text>

    <rect x="18" y="642" width="354" height="75" rx="10" fill="#FFF0CA"/>
    <text x="32" y="667" class="section" fill="#8A5A00">저장 후 추천이 갱신됩니다</text>
    <text x="32" y="689" class="small">예약 생성 성공 뒤 서버가 해당 기사 추천을 다시 계산합니다.</text>
    <text x="32" y="706" class="micro">저장 실패 시 성공 화면으로 넘기지 않고 입력값을 유지합니다.</text>

    <rect x="18" y="735" width="116" height="43" rx="9" fill="#FFFFFF" stroke="#BFD5D2"/><text x="76" y="761" text-anchor="middle" class="button">취소</text>
    <rect x="144" y="735" width="228" height="43" rx="9" fill="#009688"/><text x="258" y="761" text-anchor="middle" class="button" fill="#FFFFFF">예약 저장</text>
    <line x1="0" y1="790" x2="390" y2="790" stroke="#D7E3E1"/>
    <text x="49" y="819" text-anchor="middle" class="micro">⌂</text><text x="49" y="836" text-anchor="middle" class="micro">홈</text>
    <text x="147" y="819" text-anchor="middle" class="micro">◇</text><text x="147" y="836" text-anchor="middle" class="micro">추천</text>
    <text x="245" y="819" text-anchor="middle" font-size="15" fill="#009688">▣</text><text x="245" y="836" text-anchor="middle" class="micro" fill="#009688">예약</text>
    <text x="342" y="819" text-anchor="middle" class="micro">₩</text><text x="342" y="836" text-anchor="middle" class="micro">정산</text>
  </g>

  <g transform="translate(996 96)">
    <rect width="390" height="850" rx="18" fill="#F4FAF8" filter="url(#shadow)"/>
    <text x="0" y="-14" class="api">GET /reservations/{id} → POST /reservations/{id}/cancel</text>
    <rect width="390" height="58" rx="18" fill="#FFFFFF"/><rect y="40" width="390" height="18" fill="#FFFFFF"/>
    <text x="18" y="36" font-size="22" font-weight="700" fill="#008F83">‹</text><text x="52" y="35" font-size="17" font-weight="800">예약 상세</text>
    <rect x="292" y="15" width="80" height="28" rx="14" fill="#E7F7F3"/><text x="332" y="33" text-anchor="middle" class="button" fill="#00796F">미래 예약</text>

    <text x="18" y="94" class="screen-title">예약 #824</text>
    <text x="18" y="118" class="subtitle">본인 예약 ID를 서버에서 다시 조회한 최신 내용입니다.</text>

    <rect x="18" y="137" width="354" height="236" rx="12" fill="#FFFFFF" stroke="#BFD8D4"/>
    <text x="32" y="166" class="small">시작시각</text><text x="32" y="193" class="value">2026. 07. 27. 09:30</text>
    <line x1="32" y1="210" x2="340" y2="210" stroke="#E1ECEA"/>
    <text x="32" y="237" class="small">시작 모드</text><text x="190" y="237" class="body" font-weight="700">reserved</text>
    <text x="32" y="269" class="small">시작 위치</text><text x="32" y="290" class="body" font-weight="700">성남시 분당구 정자동</text>
    <text x="32" y="323" class="small">복귀지</text><text x="32" y="344" class="body">서울시 송파구 문정동</text>

    <rect x="18" y="389" width="354" height="82" rx="10" fill="#E7F7F3"/>
    <text x="32" y="416" class="section" fill="#00796F">취소 가능</text>
    <text x="32" y="439" class="small">예약 상태가 reserved이고 시작시각 전이라서 취소할 수 있습니다.</text>
    <text x="32" y="457" class="micro">지난 예약과 시작된 예약은 서버가 취소를 거부합니다.</text>

    <rect x="18" y="487" width="354" height="134" rx="11" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="514" class="section">예약을 취소할까요?</text>
    <text x="32" y="539" class="body">이 예약만 삭제되며 이미 시작한 운행에는 영향이 없습니다.</text>
    <rect x="32" y="559" width="137" height="39" rx="9" fill="#FFFFFF" stroke="#BFD5D2"/><text x="100" y="583" text-anchor="middle" class="button">계속 유지</text>
    <rect x="179" y="559" width="161" height="39" rx="9" fill="#C2413B"/><text x="259" y="583" text-anchor="middle" class="button" fill="#FFFFFF">예약 취소 확인</text>

    <rect x="18" y="637" width="354" height="99" rx="10" fill="#F8FAFC"/>
    <text x="32" y="663" class="section">취소 결과</text>
    <circle cx="43" cy="693" r="11" fill="#009688"/><text x="43" y="697" text-anchor="middle" class="micro" fill="#FFFFFF">✓</text>
    <text x="64" y="691" class="body" font-weight="700">예약이 취소되었습니다.</text>
    <text x="64" y="713" class="small">응답 Id 824 확인 후 목록을 다시 조회합니다.</text>

    <rect x="18" y="752" width="354" height="36" rx="9" fill="#009688"/><text x="195" y="775" text-anchor="middle" class="button" fill="#FFFFFF">예약 목록으로</text>
    <line x1="0" y1="790" x2="390" y2="790" stroke="#D7E3E1"/>
    <text x="49" y="819" text-anchor="middle" class="micro">⌂</text><text x="49" y="836" text-anchor="middle" class="micro">홈</text>
    <text x="147" y="819" text-anchor="middle" class="micro">◇</text><text x="147" y="836" text-anchor="middle" class="micro">추천</text>
    <text x="245" y="819" text-anchor="middle" font-size="15" fill="#009688">▣</text><text x="245" y="836" text-anchor="middle" class="micro" fill="#009688">예약</text>
    <text x="342" y="819" text-anchor="middle" class="micro">₩</text><text x="342" y="836" text-anchor="middle" class="micro">정산</text>
  </g>

  <rect x="54" y="970" width="1332" height="42" rx="12" fill="#DCEAE8"/>
  <text x="720" y="996" text-anchor="middle" class="body">목록 조회 → 미래 시각·시작 위치 검증 → 생성 → 같은 예약 ID 상세 재조회 → 시작 전 본인 예약만 취소 → 목록 재조회</text>
</svg>
