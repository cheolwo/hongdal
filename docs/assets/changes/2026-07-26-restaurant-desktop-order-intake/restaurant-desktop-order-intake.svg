<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; fill: #2b2524; }
      .title { font-size: 28px; font-weight: 800; }
      .subtitle { font-size: 13px; fill: #746b68; }
      .nav { font-size: 14px; font-weight: 650; fill: #d8cfcc; }
      .nav-on { font-size: 14px; font-weight: 800; fill: #ffffff; }
