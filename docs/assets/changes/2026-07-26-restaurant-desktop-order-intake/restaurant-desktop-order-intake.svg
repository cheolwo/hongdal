  <rect x="1142" y="730" width="246" height="58" rx="14" fill="#d7623f"/>
  <path d="M1163 758l7 7 13-15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
