      .label { font-size: 11px; font-weight: 700; fill: #897d79; }
      .body { font-size: 14px; font-weight: 650; }
      .small { font-size: 12px; fill: #746b68; }
      .tiny { font-size: 10px; fill: #8c827e; }
      .chip { font-size: 11px; font-weight: 750; }
      .white { fill: #ffffff; }
      .muted-white { fill: #eadfdb; }
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
