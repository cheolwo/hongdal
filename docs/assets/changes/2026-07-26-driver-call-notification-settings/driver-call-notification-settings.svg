<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "Helvetica Neue", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #18302F; }
      .title { font-size: 25px; font-weight: 800; }
      .subtitle { font-size: 12px; fill: #64748B; }
      .screen-title { font-size: 22px; font-weight: 800; }
      .section { font-size: 14px; font-weight: 800; }
      .body { font-size: 12px; }
      .small { font-size: 10px; fill: #64748B; }
      .micro { font-size: 9px; fill: #64748B; }
      .button { font-size: 11px; font-weight: 800; }
      .api { font-family: Consolas, "Courier New", monospace; font-size: 10px; fill: #00796F; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#EEF1F5"/>
  <text x="54" y="46" class="title">04.20 · 일반 운송 기사 · 콜 범위·알림·푸시 설정</text>
  <text x="54" y="71" class="subtitle">서버가 실제 지원하는 전국 콜 여부, 여섯 가지 알림 옵션, 기기 푸시 토큰 상태를 각각 조회·저장·해제합니다.</text>

  <g transform="translate(54 96)">
    <rect width="390" height="850" rx="18" fill="#F4FAF8" filter="url(#shadow)"/>
    <text x="0" y="-14" class="api">GET · PUT /api/v1/driver/preferences/call-scope</text>
    <rect width="390" height="58" rx="18" fill="#FFFFFF"/><rect y="40" width="390" height="18" fill="#FFFFFF"/>
    <text x="18" y="36" font-size="22" font-weight="700" fill="#008F83">‹</text><text x="52" y="35" font-size="17" font-weight="800">운행 설정</text>

    <text x="18" y="94" class="screen-title">콜 수신 범위</text>
    <text x="18" y="118" class="subtitle">내 기사 계정에 저장된 현재 범위를 서버에서 확인합니다.</text>

    <rect x="18" y="139" width="354" height="154" rx="12" fill="#FFFFFF" stroke="#BFD8D4"/>
    <text x="32" y="169" class="section">전국 콜 받기</text>
    <text x="32" y="193" class="small">NationwideEnabled</text>
    <rect x="290" y="156" width="58" height="31" rx="16" fill="#009688"/><circle cx="332" cy="171" r="12" fill="#FFFFFF"/>
    <text x="32" y="225" class="body">켜면 지역과 관계없이 공개된 운송 후보를 조회할 수 있습니다.</text>
    <text x="32" y="249" class="small">이 설정은 콜 노출 범위이며 자동 수락·자동 배차 동의가 아닙니다.</text>
    <rect x="32" y="263" width="116" height="22" rx="11" fill="#E7F7F3"/><text x="90" y="278" text-anchor="middle" class="micro" fill="#00796F">현재 상태 · 전국</text>

    <rect x="18" y="310" width="354" height="140" rx="11" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="338" class="section">서버 계약의 현재 범위</text>
    <text x="32" y="365" class="body">전국 켜기 / 끄기</text><text x="332" y="365" text-anchor="end" class="button" fill="#00796F">지원</text>
    <line x1="32" y1="379" x2="340" y2="379" stroke="#E1ECEA"/>
    <text x="32" y="403" class="body">반경 km 직접 입력</text><text x="332" y="403" text-anchor="end" class="button" fill="#9A5A12">계약 없음</text>
    <text x="32" y="429" class="small">반경 슬라이더나 임의 지역 목록은 API 확장 전 표시하지 않습니다.</text>

    <rect x="18" y="468" width="354" height="91" rx="10" fill="#FFF0CA"/>
    <text x="32" y="495" class="section" fill="#8A5A00">저장 전 확인</text>
    <text x="32" y="518" class="small">전국으로 넓히면 더 많은 콜이 보일 수 있으나 직접 선택은 유지됩니다.</text>
    <text x="32" y="538" class="micro">지리적 가까움은 추천 후보일 뿐 배차 확정 근거가 아닙니다.</text>

    <rect x="18" y="578" width="354" height="68" rx="10" fill="#E7F7F3"/>
    <circle cx="44" cy="612" r="11" fill="#009688"/><text x="44" y="616" text-anchor="middle" class="micro" fill="#FFFFFF">✓</text>
    <text x="66" y="606" class="section" fill="#00796F">저장됨</text>
    <text x="66" y="628" class="small">PUT 성공 뒤 GET으로 최신 값을 다시 확인합니다.</text>

    <rect x="18" y="665" width="354" height="43" rx="9" fill="#009688"/><text x="195" y="691" text-anchor="middle" class="button" fill="#FFFFFF">콜 범위 저장</text>
    <rect x="18" y="720" width="354" height="43" rx="9" fill="#FFFFFF" stroke="#BFD5D2"/><text x="195" y="746" text-anchor="middle" class="button">저장하지 않고 돌아가기</text>

    <line x1="0" y1="790" x2="390" y2="790" stroke="#D7E3E1"/>
    <text x="49" y="819" text-anchor="middle" class="micro">⌂</text><text x="49" y="836" text-anchor="middle" class="micro">홈</text>
    <text x="147" y="819" text-anchor="middle" class="micro">◇</text><text x="147" y="836" text-anchor="middle" class="micro">추천</text>
    <text x="245" y="819" text-anchor="middle" class="micro">▣</text><text x="245" y="836" text-anchor="middle" class="micro">운송</text>
    <text x="342" y="819" text-anchor="middle" font-size="15" fill="#009688">⚙</text><text x="342" y="836" text-anchor="middle" class="micro" fill="#009688">설정</text>
  </g>

  <g transform="translate(525 96)">
    <rect width="390" height="850" rx="18" fill="#F4FAF8" filter="url(#shadow)"/>
    <text x="0" y="-14" class="api">GET · PUT /api/v1/driver/notifications/settings</text>
    <rect width="390" height="58" rx="18" fill="#FFFFFF"/><rect y="40" width="390" height="18" fill="#FFFFFF"/>
    <text x="18" y="36" font-size="22" font-weight="700" fill="#008F83">‹</text><text x="52" y="35" font-size="17" font-weight="800">알림 설정</text>

    <text x="18" y="94" class="screen-title">알림을 어떻게 받을까요?</text>
    <text x="18" y="118" class="subtitle">저장된 여섯 옵션을 조회하고 한 번에 서버에 반영합니다.</text>

    <rect x="18" y="138" width="354" height="128" rx="12" fill="#FFFFFF" stroke="#BFD8D4"/>
    <text x="32" y="168" class="section">추천 알림</text>
    <text x="32" y="194" class="body">배차추천 알림 사용</text>
    <rect x="290" y="178" width="58" height="30" rx="15" fill="#009688"/><circle cx="332" cy="193" r="12" fill="#FFFFFF"/>
    <text x="32" y="229" class="body">운전 중에는 푸시만 사용</text>
    <rect x="290" y="213" width="58" height="30" rx="15" fill="#009688"/><circle cx="332" cy="228" r="12" fill="#FFFFFF"/>
    <text x="32" y="253" class="micro">화면을 가리는 동작 없이 OS 푸시로만 안내</text>

    <rect x="18" y="280" width="354" height="128" rx="12" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="310" class="section">알림 방식</text>
    <text x="32" y="337" class="body">소리 사용</text>
    <rect x="290" y="321" width="58" height="30" rx="15" fill="#E2E8F0"/><circle cx="306" cy="336" r="12" fill="#FFFFFF"/>
    <text x="32" y="375" class="body">진동 사용</text>
    <rect x="290" y="359" width="58" height="30" rx="15" fill="#009688"/><circle cx="332" cy="374" r="12" fill="#FFFFFF"/>
    <text x="32" y="397" class="micro">운전 환경과 기기 권한에 따라 실제 동작이 달라질 수 있습니다.</text>

    <rect x="18" y="422" width="354" height="128" rx="12" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="452" class="section">집중과 안전</text>
    <text x="32" y="479" class="body">야간 알림 제한</text>
    <rect x="290" y="463" width="58" height="30" rx="15" fill="#009688"/><circle cx="332" cy="478" r="12" fill="#FFFFFF"/>
    <text x="32" y="517" class="body">정차 후 모아보기</text>
    <rect x="290" y="501" width="58" height="30" rx="15" fill="#009688"/><circle cx="332" cy="516" r="12" fill="#FFFFFF"/>
    <text x="32" y="539" class="micro">야간 시간대나 모아보기 세부 규칙은 서버 정책을 따릅니다.</text>

    <rect x="18" y="566" width="354" height="75" rx="10" fill="#E7F7F3"/>
    <text x="32" y="593" class="section" fill="#00796F">현재 서버 설정을 먼저 불러옴</text>
    <text x="32" y="616" class="small">저장 실패 시 기존 서버 값과 화면 변경값을 구분해 재시도합니다.</text>
    <text x="32" y="633" class="micro">성공 뒤 GET으로 재조회하여 여러 기기에서 같은 값을 확인합니다.</text>

    <rect x="18" y="661" width="354" height="43" rx="9" fill="#009688"/><text x="195" y="687" text-anchor="middle" class="button" fill="#FFFFFF">알림 설정 저장</text>
    <rect x="18" y="716" width="354" height="43" rx="9" fill="#FFFFFF" stroke="#BFD5D2"/><text x="195" y="742" text-anchor="middle" class="button">푸시 기기 상태 보기</text>

    <line x1="0" y1="790" x2="390" y2="790" stroke="#D7E3E1"/>
    <text x="49" y="819" text-anchor="middle" class="micro">⌂</text><text x="49" y="836" text-anchor="middle" class="micro">홈</text>
    <text x="147" y="819" text-anchor="middle" class="micro">◇</text><text x="147" y="836" text-anchor="middle" class="micro">추천</text>
    <text x="245" y="819" text-anchor="middle" class="micro">▣</text><text x="245" y="836" text-anchor="middle" class="micro">운송</text>
    <text x="342" y="819" text-anchor="middle" font-size="15" fill="#009688">⚙</text><text x="342" y="836" text-anchor="middle" class="micro" fill="#009688">설정</text>
  </g>

  <g transform="translate(996 96)">
    <rect width="390" height="850" rx="18" fill="#F4FAF8" filter="url(#shadow)"/>
    <text x="0" y="-14" class="api">GET · PUT · DELETE /api/v1/driver/notifications/push-token</text>
    <rect width="390" height="58" rx="18" fill="#FFFFFF"/><rect y="40" width="390" height="18" fill="#FFFFFF"/>
    <text x="18" y="36" font-size="22" font-weight="700" fill="#008F83">‹</text><text x="52" y="35" font-size="17" font-weight="800">푸시 기기</text>

    <text x="18" y="94" class="screen-title">이 기기의 푸시 상태</text>
    <text x="18" y="118" class="subtitle">기기 권한과 서버 토큰 등록 여부를 나누어 확인합니다.</text>

    <rect x="18" y="139" width="354" height="104" rx="12" fill="#FFFFFF" stroke="#BFD8D4"/>
    <circle cx="50" cy="190" r="22" fill="#E7F7F3"/><text x="50" y="196" text-anchor="middle" font-size="20" fill="#00796F">↗</text>
    <text x="84" y="172" class="section">기기 알림 권한</text>
    <text x="84" y="195" class="body" font-weight="700">허용됨</text>
    <text x="84" y="217" class="small">OS 설정은 앱이 임의로 변경하지 않습니다.</text>
    <rect x="286" y="165" width="70" height="28" rx="14" fill="#E7F7F3"/><text x="321" y="183" text-anchor="middle" class="button" fill="#00796F">정상</text>

    <rect x="18" y="259" width="354" height="151" rx="12" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="289" class="section">서버 등록 상태</text>
    <text x="32" y="316" class="small">HasToken</text><text x="332" y="316" text-anchor="end" class="body" font-weight="700">등록됨</text>
    <text x="32" y="347" class="small">PushToken</text><text x="332" y="347" text-anchor="end" class="body">••••••••••7A9C</text>
    <line x1="32" y1="363" x2="340" y2="363" stroke="#E1ECEA"/>
    <text x="32" y="388" class="small">토큰 원문은 화면·로그·캡처에 노출하지 않습니다.</text>
    <text x="32" y="403" class="micro">서버 응답에 값이 있어도 사용자 화면에서는 마스킹합니다.</text>

    <rect x="18" y="426" width="354" height="119" rx="11" fill="#FFFFFF" stroke="#D7E3E1"/>
    <text x="32" y="455" class="section">기기 다시 연결</text>
    <text x="32" y="480" class="body">기기에서 발급된 현재 토큰을 서버에 등록합니다.</text>
    <text x="32" y="501" class="small">권한 허용 → 토큰 확보 → PUT 성공 → 상태 재조회</text>
    <rect x="32" y="513" width="308" height="32" rx="8" fill="#009688"/><text x="186" y="534" text-anchor="middle" class="button" fill="#FFFFFF">현재 기기 연결</text>

    <rect x="18" y="561" width="354" height="104" rx="10" fill="#FFF4E8" stroke="#F0C998"/>
    <text x="32" y="590" class="section" fill="#9A5A12">이 기기에서 알림을 그만 받기</text>
    <text x="32" y="614" class="small">서버에 저장된 푸시 토큰만 삭제하며 알림함 기록은 유지됩니다.</text>
    <rect x="32" y="629" width="308" height="36" rx="8" fill="#FFFFFF"/><text x="186" y="652" text-anchor="middle" class="button" fill="#B45309">기기 연결 해제</text>

    <rect x="18" y="683" width="354" height="75" rx="10" fill="#E7F7F3"/>
    <text x="32" y="709" class="section" fill="#00796F">연결 해제 완료</text>
    <text x="32" y="731" class="small">DELETE 성공 뒤 HasToken=false를 재조회해 화면을 갱신합니다.</text>
    <text x="32" y="749" class="micro">네트워크 실패 시 토큰이 삭제됐다고 단정하지 않습니다.</text>

    <line x1="0" y1="790" x2="390" y2="790" stroke="#D7E3E1"/>
    <text x="49" y="819" text-anchor="middle" class="micro">⌂</text><text x="49" y="836" text-anchor="middle" class="micro">홈</text>
    <text x="147" y="819" text-anchor="middle" class="micro">◇</text><text x="147" y="836" text-anchor="middle" class="micro">추천</text>
    <text x="245" y="819" text-anchor="middle" class="micro">▣</text><text x="245" y="836" text-anchor="middle" class="micro">운송</text>
    <text x="342" y="819" text-anchor="middle" font-size="15" fill="#009688">⚙</text><text x="342" y="836" text-anchor="middle" class="micro" fill="#009688">설정</text>
  </g>

  <rect x="54" y="970" width="1332" height="42" rx="12" fill="#DCEAE8"/>
  <text x="720" y="996" text-anchor="middle" class="body">서버 값 조회 → 사용자가 명시적으로 수정 → 저장 성공 확인 → 같은 API 재조회 · 자동 배차와 토큰 원문 노출은 하지 않음</text>
</svg>
