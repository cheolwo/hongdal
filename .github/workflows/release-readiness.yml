name: Release readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  version-readiness:
    name: Version builds, tests, and publish
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET workloads
        run: dotnet workload restore Ssalddel.v1.5.slnx

      - name: Install WebAssembly publish tools
        run: dotnet workload install wasm-tools --skip-manifest-update --verbosity minimal

      - name: Restore version 0.0 slice
        run: >-
          dotnet restore Ssalddel.v0.0.slnx
          --artifacts-path artifacts/build/v0
          --property:Configuration=Release

      - name: Restore version 1.0 slice
        run: >-
          dotnet restore Ssalddel.v1.0.slnx
          --artifacts-path artifacts/build/v1
          --property:Configuration=Release

      - name: Restore version 1.5 slice
        run: >-
          dotnet restore Ssalddel.v1.5.slnx
          --artifacts-path artifacts/build/v15
          --property:Configuration=Release

      - name: Build version 0.0 slice
        run: >-
          dotnet build Ssalddel.v0.0.slnx
          --artifacts-path artifacts/build/v0
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Build version 1.0 slice
        run: >-
          dotnet build Ssalddel.v1.0.slnx
          --artifacts-path artifacts/build/v1
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Build version 1.5 slice
        run: >-
          dotnet build Ssalddel.v1.5.slnx
          --artifacts-path artifacts/build/v15
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Run full test suite
        run: >-
          dotnet test Ssalddel.Tests/Ssalddel.Tests.csproj
          --artifacts-path artifacts/build/v15
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=ssalddel-tests.trx"
          --results-directory artifacts/test-results

      - name: Publish server
        run: >-
          dotnet publish Ssalddel/Ssalddel.csproj
          --artifacts-path artifacts/build/v15
          --configuration Release
          --no-restore
          --output artifacts/publish/server
          -p:ContinuousIntegrationBuild=true
          -p:UseAppHost=false

      - name: Publish web client
        run: >-
          dotnet publish Ssalddel.WebApp/Ssalddel.WebApp.csproj
          --artifacts-path artifacts/build/v15
          --configuration Release
          --no-restore
          --output artifacts/publish/web
          -p:ContinuousIntegrationBuild=true

      - name: Publish 1.5 admin workbench
        run: >-
          dotnet publish SsalddelAdmin/SsalddelAdmin.csproj
          --artifacts-path artifacts/build/v15
          --configuration Release
          --no-restore
          --output artifacts/publish/admin
          -p:ContinuousIntegrationBuild=true
          -p:UseAppHost=false

      - name: Upload release-readiness outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-readiness-${{ github.run_number }}
          path: |
            artifacts/publish/
            artifacts/test-results/
          if-no-files-found: error
          retention-days: 14

  container-readiness:
    name: Compose and container build
    needs: version-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose --env-file docker-compose.env.example config --quiet

      - name: Build server container
        run: docker build --file Ssalddel/Dockerfile --tag ssalddel:release-readiness .
