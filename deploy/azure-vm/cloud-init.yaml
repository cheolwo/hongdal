#cloud-config
package_update: true
package_upgrade: false
packages:
  - docker.io
  - docker-compose-v2

runcmd:
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, azureuser]
  - [mkdir, -p, /opt/ssalddel/web]
  - [chown, -R, azureuser:azureuser, /opt/ssalddel]
  - [bash, -lc, "if ! swapon --show | grep -q /swapfile; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi"]

final_message: "Ssalddel Azure preview host bootstrap completed."
