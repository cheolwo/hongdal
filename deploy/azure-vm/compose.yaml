name: ssalddel-preview

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${SSALDDEL_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ssalddel
      MYSQL_USER: ssalddel
      MYSQL_PASSWORD: "${SSALDDEL_MYSQL_PASSWORD}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=192M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 560m

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ssalddel
      MONGO_INITDB_ROOT_PASSWORD: "${SSALDDEL_MONGO_PASSWORD}"
      MONGO_INITDB_DATABASE: ssalddel
      TZ: Asia/Seoul
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s
    mem_limit: 560m

  app:
    image: ssalddel-server:azure-preview
    pull_policy: never
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      AllowedHosts: "${SSALDDEL_SITE_HOST}"
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=ssalddel;user=ssalddel;password=${SSALDDEL_MYSQL_PASSWORD};SslMode=None;AllowPublicKeyRetrieval=True;"
      MongoDb__ConnectionString: "mongodb://ssalddel:${SSALDDEL_MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MongoDb__Database: ssalddel
      TransientState__Provider: Memory
      DatabaseInitialization__RunAtStartup: "false"
      DatabaseInitialization__FailOnError: "true"
      IdentitySeed__BootstrapAdmin__Enabled: "${SSALDDEL_BOOTSTRAP_ADMIN_ENABLED:-false}"
      IdentitySeed__BootstrapAdmin__UserName: "${SSALDDEL_BOOTSTRAP_ADMIN_USER_NAME:-}"
      IdentitySeed__BootstrapAdmin__Email: "${SSALDDEL_BOOTSTRAP_ADMIN_EMAIL:-}"
      IdentitySeed__BootstrapAdmin__Password: "${SSALDDEL_BOOTSTRAP_ADMIN_PASSWORD:-}"
      IdentitySeed__DevelopmentAccounts__Enabled: "false"
      Jwt__Issuer: Ssalddel.AzurePreview
      Jwt__Audience: Ssalddel.WebApp.AzurePreview
      Jwt__SecretKey: "${SSALDDEL_JWT_SECRET_KEY}"
      PersonalDataProtection__ApplicationName: Ssalddel.AzurePreview
      PersonalDataProtection__KeyRingPath: /app/App_Data/DataProtection-Keys
      PersonalDataProtection__RequireCertificate: "true"
      PersonalDataProtection__CertificatePath: /run/secrets/ssalddel-data-protection.pfx
      PersonalDataProtection__CertificatePassword: "${SSALDDEL_DATA_PROTECTION_CERTIFICATE_PASSWORD}"
      IsmsPProtectedData__Aes256GcmKeyBase64: "${SSALDDEL_ISMS_P_AES_KEY_BASE64}"
      IsmsPProtectedData__HashSalt: "${SSALDDEL_ISMS_P_HASH_SALT}"
      IsmsPProtectedData__FailWhenKeyMissing: "true"
      SsalddelExecution__Mode: Simulation
      VersionFeatureFlags__CommunityTrustWorkflow: "true"
      VersionFeatureFlags__GroupPurchaseDemandWorkflow: "false"
      VersionFeatureFlags__GroupPurchasePracticeWorkflow: "false"
      VersionFeatureFlags__CustomsAndTradeDataWorkflow: "false"
      VersionFeatureFlags__DomesticTransportWorkflow: "false"
      VersionFeatureFlags__WarehouseFulfillmentWorkflow: "false"
      VersionFeatureFlags__SalesChannelFulfillmentWorkflow: "false"
      VersionFeatureFlags__HrParticipationWorkflow: "false"
      VersionFeatureFlags__FoodDeliveryWorkflow: "false"
      VersionFeatureFlags__SsalddelMartWorkflow: "false"
      CustomsBrokerCors__AllowedOrigins__0: "https://${SSALDDEL_SITE_HOST}"
      AgriculturalFisheriesBatch__Enabled: "false"
      CommunityEditorialBatch__Enabled: "false"
      CommunityPostTranslation__Enabled: "${SSALDDEL_COMMUNITY_TRANSLATION_ENABLED:-false}"
      CommunityPostTranslation__AuthenticationMode: MicrosoftEntraId
      CommunityPostTranslation__Endpoint: "${SSALDDEL_AZURE_TRANSLATOR_ENDPOINT:-https://api.cognitive.microsofttranslator.com}"
      CommunityPostTranslation__ResourceId: "${SSALDDEL_AZURE_TRANSLATOR_RESOURCE_ID:-}"
      CommunityPostTranslation__ManagedIdentityClientId: "${SSALDDEL_AZURE_TRANSLATOR_MANAGED_IDENTITY_CLIENT_ID:-}"
      CommunityPostTranslation__Region: "${SSALDDEL_AZURE_TRANSLATOR_REGION:-koreacentral}"
      CommunityPostEmailNotifications__Enabled: "${SSALDDEL_COMMUNITY_POST_EMAIL_ENABLED:-false}"
      CommunityPostEmailNotifications__RecipientEmail: "${SSALDDEL_COMMUNITY_POST_EMAIL_RECIPIENT:-}"
      CommunityPostEmailNotifications__PublicBaseUrl: "https://${SSALDDEL_SITE_HOST}"
      CommunityPostEmailNotifications__Gmail__UserName: "${SSALDDEL_GMAIL_USER_NAME:-}"
      CommunityPostEmailNotifications__Gmail__AppPassword: "${SSALDDEL_GMAIL_APP_PASSWORD:-}"
      CommunityPostEmailNotifications__Gmail__FromAddress: "${SSALDDEL_GMAIL_FROM_ADDRESS:-}"
      SalesChannelOrderSync__Enabled: "false"
      WorkRelationshipSnapshots__Enabled: "false"
      YouTube__Enabled: "false"
      HongikHakdangCards__Enabled: "false"
      ObjectStorage__Provider: AzureBlob
      AzureBlobStorage__ServiceUri: "https://${SSALDDEL_STORAGE_ACCOUNT_NAME}.blob.core.windows.net"
      AzureBlobStorage__PublicContainerName: community-public
      AzureBlobStorage__PrivateContainerName: platform-private
      CommunityPostStorage__Folder: community/posts
    volumes:
      - app_data:/app/App_Data
      - app_uploads:/app/uploads
      - ./secrets/ssalddel-data-protection.pfx:/run/secrets/ssalddel-data-protection.pfx:ro
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--header", "Host: ${SSALDDEL_SITE_HOST}", "http://127.0.0.1:8080/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    mem_limit: 760m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SSALDDEL_SITE_HOST: "${SSALDDEL_SITE_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

volumes:
  mysql_data:
  mongo_data:
  app_data:
  app_uploads:
  caddy_data:
  caddy_config:
