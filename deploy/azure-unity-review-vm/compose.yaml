name: ssalddel-unity-review

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${UNITY_REVIEW_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: unity_review
      MYSQL_USER: unity_review
      MYSQL_PASSWORD: "${UNITY_REVIEW_MYSQL_PASSWORD}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=15
      - --performance-schema=OFF
      - --table-open-cache=64
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 35s
    mem_limit: 384m
    memswap_limit: 640m

  api:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    restart: unless-stopped
    working_dir: /app
    command: ["dotnet", "Ssalddel.UnityReview.Api.dll", "--contentRoot", "/review-content"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: "${UNITY_REVIEW_SITE_HOST}"
      ConnectionStrings__UnityReview: "server=mysql;port=3306;database=unity_review;user=unity_review;password=${UNITY_REVIEW_MYSQL_PASSWORD};SslMode=None;AllowPublicKeyRetrieval=True;ConnectionTimeout=15;DefaultCommandTimeout=30;"
      UnityReviewAccess__AdminUserName: "${UNITY_REVIEW_ADMIN_USER_NAME}"
      UnityReviewAccess__AdminPasswordPbkdf2: "${UNITY_REVIEW_ADMIN_PASSWORD_PBKDF2}"
      UnityReviewAccess__JwtSigningKeyBase64: "${UNITY_REVIEW_JWT_SIGNING_KEY_BASE64}"
      UnityReviewAccess__JwtIssuer: Ssalddel.UnityReview.AzureVm
      UnityReviewAccess__JwtAudience: Ssalddel.UnityReview.Web.AzureVm
      UnityReviewAccess__TokenLifetimeHours: "12"
      ObjectStorage__Provider: Local
      DOTNET_EnableDiagnostics: "0"
      DOTNET_GCConserveMemory: "9"
      TZ: Asia/Seoul
    volumes:
      - ./api:/app:ro
      - review_images:/review-content
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 320m
    memswap_limit: 512m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      UNITY_REVIEW_SITE_HOST: "${UNITY_REVIEW_SITE_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - review_images:/review-content:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 64m
    memswap_limit: 96m

volumes:
  mysql_data:
  review_images:
  caddy_data:
  caddy_config:
